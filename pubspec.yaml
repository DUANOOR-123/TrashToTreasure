name: trash2treasure
description: "Trash 2 Treasure - buy and sell reusable waste materials."

# Prevents the package from being accidentally published to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  google_fonts: ^6.3.0
  http: ^1.6.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Without this, Image.asset() cannot find the pictures in assets/images/
  assets:
    - assets/images/
